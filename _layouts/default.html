<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <style>
    body { margin: 0; background: #fdfdfc; color: #1a1a1a;
      font: 16px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 1.6em; line-height: 1.3; }
    a { color: #4B3FE3; }
    hr { border: 0; border-top: 1px solid #e5e5e0; margin: 2em 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #17171a; color: #e5e5e0; }
      a { color: #A9AEFF; }
      hr { border-top-color: #333338; }
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
